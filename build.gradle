plugins {
	// 26.1+ uses the new non-remapping Loom plugin (Minecraft is unobfuscated;
	// Yarn and Mojang ProGuard mappings are gone). See:
	// https://fabricmc.net/2026/03/14/261.html
	id 'net.fabricmc.fabric-loom' version '1.17.12'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
    maven {
    	name = "ModMenu"
    	url = "https://maven.terraformersmc.com/releases/"
    }
    maven {
    	name = "Cloth+REI"
    	url = "https://maven.shedaniel.me/"
    }
}

dependencies {
	// No mappings: Minecraft 26.x ships unobfuscated, so Loom does not remap.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Deps (no longer remapped -> plain implementation)
	implementation("com.terraformersmc:modmenu:${project.modmenu_version}")  {
      exclude module: 'fabric-api'
      exclude module: 'config-2'
      exclude module: 'cloth-config-fabric'
      exclude module: 'roughlyenoughitems-api'
    }

	implementation("me.shedaniel.cloth:cloth-config-fabric:${project.clothconfig_version}") {
      exclude module: 'fabric-api'
      exclude module: 'config-2'
      exclude module: 'cloth-config-fabric'
      exclude module: 'roughlyenoughitems-api'
    }

	// Bundle Cloth Config into the released jar (jar-in-jar)
	include "me.shedaniel.cloth:cloth-config-fabric:${project.clothconfig_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach  {
	it.options.release = 25
}


java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archives_base_name}"}
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}
